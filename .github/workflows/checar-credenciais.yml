# Confere em ~30 s se as credenciais do Google (YouTube e Drive) funcionam, sem gerar vídeo.
# Rode depois de trocar algum segredo: Actions → Checar credenciais → Run workflow.
name: Checar credenciais

on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Conferir
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python tools/checar_credenciais.py
