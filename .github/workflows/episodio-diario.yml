# Robô diário da série (GitHub Actions, sem o seu PC). Ver serie-ingles/PLANO-DO-TIME.md.
# - 2 rodadas por dia (~13 e ~23 UTC): cada uma publica o próximo micro-Short GLOBAL (serie-ingles/fila-global/) no YouTube
#   e guarda a cópia no Google Drive.
# - Na 1ª rodada do dia também sai o episódio em PORTUGUÊS (serie-ingles/fila/), só para o Drive
#   (o dono reposta no TikTok e no Facebook; o YouTube agora é global).
# Quem sai da fila vai para publicados-global/ ou publicados/. Segredos: serie-ingles/SETUP.md.
name: Episódio diário

on:
  schedule:
    # O GitHub atrasa agendamentos em horário de pico (medido: 3-5 h). Marcamos ~4 h antes do horário-alvo:
    - cron: '17 9 * * *'  # alvo ~13 UTC: noite na Índia, tarde na Europa, manhã nas Américas
    - cron: '17 19 * * *' # alvo ~23 UTC: noite nas Américas
  workflow_dispatch:
    inputs:
      rodada:
        description: 'O que produzir: global, pt ou ambos'
        default: 'global'
      privacidade:
        description: 'Privacidade no YouTube (public, unlisted, private)'
        default: 'public'

permissions:
  contents: write

concurrency:
  group: episodio-diario
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEM_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
      TEM_DRIVE: ${{ secrets.RCLONE_CONF != '' || secrets.DRIVE_REFRESH_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '' }}
      PYTHONIOENCODING: utf-8
      # Agendamento: a 1ª rodada do dia faz global + pt; a 2ª só global.
      RODADA: ${{ inputs.rodada || (github.event.schedule == '17 9 * * *' && 'ambos') || 'global' }}
      YT_PRIVACIDADE: ${{ inputs.privacidade || 'public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji rclone
          npm ci
          python -m pip install -q edge-tts numpy requests google-api-python-client google-auth

      - name: Acesso ao Google Drive
        if: env.TEM_DRIVE == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONF" ]; then
            printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          else
            python tools/drive_conf.py  # autorização do Drive (ou a do YouTube), escopo drive.file
          fi

      - name: Micro-Short global (YouTube + Drive)
        id: global
        if: env.RODADA == 'global' || env.RODADA == 'ambos'
        continue-on-error: true  # uma falha aqui não impede o episódio em português
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COMMENT_REFRESH_TOKEN: ${{ secrets.YT_COMMENT_REFRESH_TOKEN }}
        run: python tools/rodada.py global

      - name: Episódio em português (só Drive)
        id: pt
        if: env.RODADA == 'pt' || env.RODADA == 'ambos'
        continue-on-error: true
        run: |
          if [ -z "$(find serie-ingles/fotos -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \))" ]; then
            echo "::error::Faltam as fotos do apresentador em serie-ingles/fotos/."; exit 1
          fi
          python tools/rodada.py pt

      - name: Guardar como artefato (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodada
          path: edicoes/
          retention-days: 7
          if-no-files-found: ignore

      - name: Registrar o que saiu da fila
        if: always()
        run: |
          git config user.name "inglês-fácil bot"
          git config user.email "actions@users.noreply.github.com"
          git add serie-ingles/
          if git diff --cached --quiet; then echo "Nada saiu da fila."; else
            # Os roteiros saem da fila por "git mv" (renomeação): pega o nome dos que chegaram em publicados*/
            git commit -m "Publica: $(git diff --cached --name-only --diff-filter=AR -- 'serie-ingles/publicados*' | xargs -r -n1 basename | tr '\n' ' ')"
            git push
          fi

      - name: Resultado
        if: always()
        run: |
          echo "global: ${{ steps.global.outcome }}  pt: ${{ steps.pt.outcome }}"
          if [ "${{ steps.global.outcome }}" = "failure" ] || [ "${{ steps.pt.outcome }}" = "failure" ]; then exit 1; fi
