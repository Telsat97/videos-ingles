# Podcast semanal (vídeo longo 16:9). Disparo manual depois que o dono aprova os stills de revisão:
# Actions → Podcast semanal → Run workflow (roteiro + data da estreia). Ver serie-ingles/podcast/FORMATO.md.
# Um episódio de ~25 min tem ~45 mil quadros: o render é dividido em 6 partes em paralelo (runner de 2 núcleos)
# e a junção cola as partes e põe a narração inteira por cima.
name: Podcast semanal

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: 'Roteiro (ex.: serie-ingles/podcast/fila/p001-everyday-conversations.json)'
        required: true
      publicar_em:
        description: 'Estreia agendada, UTC (ex.: 2026-11-01T13:00:00Z). Vazio = fica privado para revisão'
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

env:
  PARTES: 6
  PYTHONIOENCODING: utf-8

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slug: ${{ steps.info.outputs.slug }}
      projeto: ${{ steps.info.outputs.projeto }}
      quadros: ${{ steps.info.outputs.quadros }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q edge-tts numpy
      - name: Narração (sem render)
        run: python tools/produzir.py "${{ inputs.roteiro }}" --sem-render
      - name: Dados do episódio
        id: info
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          r = json.load(open("${{ inputs.roteiro }}", encoding="utf-8"))
          proj = next(p for p in pathlib.Path("projetos").glob(f"* ingles-{r['slug']}"))
          dur = json.load(open(proj / "transcricao" / "episodio.json", encoding="utf-8"))["duracao"]
          print(f"slug={r['slug']}\nprojeto={proj.name}\nquadros={int(-(-dur * 30 // 1))}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: base
          retention-days: 3
          path: |
            projetos/
            edicoes/
            src/videos/ingles/episodios/
            src/videos/ingles/episodios.gen.ts

  render:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji
      - uses: actions/download-artifact@v4
        with:
          name: base
      - name: Render da parte ${{ matrix.parte }}
        env:
          QUADROS: ${{ needs.preparar.outputs.quadros }}
        run: |
          N=$PARTES; P=${{ matrix.parte }}
          INI=$(( QUADROS * P / N )); FIM=$(( QUADROS * (P + 1) / N - 1 ))
          npx remotion render src/index.ts "ingles-${{ needs.preparar.outputs.slug }}" "parte-$P.mp4" \
            --frames=$INI-$FIM --muted --codec=h264 --crf=20 --log=error --timeout=120000 --concurrency=2
          if [ "$P" = 0 ]; then  # a miniatura sai junto com a primeira parte
            npx remotion still src/index.ts "ingles-${{ needs.preparar.outputs.slug }}-capa" capa.jpg --image-format=jpeg --log=error
          else touch capa.jpg; fi
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          retention-days: 3
          path: |
            parte-${{ matrix.parte }}.mp4
            capa.jpg

  juntar:
    needs: [preparar, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_DRIVE: ${{ secrets.DRIVE_REFRESH_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone
          python -m pip install -q requests google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with:
          path: baixado
      - name: Juntar partes + narração
        run: |
          PROJ="${{ needs.preparar.outputs.projeto }}"; SLUG="${{ needs.preparar.outputs.slug }}"
          mkdir -p "edicoes/$PROJ"
          cp "baixado/base/edicoes/$PROJ/post.json" "baixado/parte-0/capa.jpg" "edicoes/$PROJ/"
          python - "$PROJ" <<'EOF'
          import json, sys
          p = f"edicoes/{sys.argv[1]}/post.json"
          post = json.load(open(p, encoding="utf-8"))
          post["capa"], post["arquivo"] = f"edicoes/{sys.argv[1]}/capa.jpg", f"edicoes/{sys.argv[1]}/{post['slug']}.mp4"
          json.dump(post, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF
          for P in $(seq 0 $((PARTES - 1))); do echo "file '$PWD/baixado/parte-$P/parte-$P.mp4'"; done > lista.txt
          ffmpeg -v error -y -f concat -safe 0 -i lista.txt -i "baixado/base/projetos/$PROJ/audio/narracao.wav" \
            -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "edicoes/$PROJ/$SLUG.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "edicoes/$PROJ/$SLUG.mp4"
      - name: Google Drive
        if: env.TEM_DRIVE == 'true'
        env:
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone && python tools/drive_conf.py
          PROJ="${{ needs.preparar.outputs.projeto }}"
          rclone copy "edicoes/$PROJ" "gdrive:Ingles Facil/$PROJ"
      - name: YouTube (privado ou estreia agendada)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACIDADE: private
          YT_PUBLICAR_EM: ${{ inputs.publicar_em }}
        run: python tools/publicar.py youtube "edicoes/${{ needs.preparar.outputs.projeto }}/post.json"
      - name: Registrar
        if: inputs.publicar_em != ''
        run: |
          git config user.name "inglês-fácil bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p serie-ingles/podcast/publicados
          git mv "${{ inputs.roteiro }}" serie-ingles/podcast/publicados/
          git commit -m "Podcast agendado: ${{ needs.preparar.outputs.slug }} (${{ inputs.publicar_em }})"
          git push
